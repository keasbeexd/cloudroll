# XcodeGen spec. The .xcodeproj is generated (and git-ignored) so the project
# can be edited without Xcode:
#   xcodegen generate --spec config/project.yml --project .
name: Cloudroll
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # Local HTTP server for the Memories shell (see docs/decisions/0003-local-server.md).
  FlyingFox:
    url: https://github.com/swhitty/FlyingFox
    exactVersion: 0.27.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Cloudroll:
    type: application
    platform: iOS
    sources:
      - path: ../src
        excludes: ["**/*.js"]
      # Injected into the shell page at runtime, so they ship as resources.
      - path: ../src/WebView/shell-navigation.js
        buildPhase: resources
      - path: ../src/WebView/shell-diagnostics.js
        buildPhase: resources
      - path: ../src/WebView/shell-selection.js
        buildPhase: resources
      - path: ../src/WebView/shell-viewer.js
        buildPhase: resources
      - path: ../src/WebView/shell-header.js
        buildPhase: resources
    dependencies:
      - package: FlyingFox
        product: FlyingFox
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Cloudroll
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Cloudroll uses the camera when you take a photo or video to upload to your Nextcloud.
        NSMicrophoneUsageDescription: Cloudroll records sound with videos you take to upload to your Nextcloud.
        NSPhotoLibraryAddUsageDescription: Cloudroll saves the photos and videos you choose from your Nextcloud to this iPhone.
        NSFaceIDUsageDescription: Cloudroll uses Face ID to unlock when you've turned on the lock in its settings.
        NSPhotoLibraryUsageDescription: Cloudroll shows the photos and videos on this iPhone in your Memories timeline, next to the ones on your Nextcloud.
        # The web view loads the shell over plain http from 127.0.0.1; everything
        # leaving the device still goes over https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        # Placeholder until the App Store bundle ID is registered.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.keasbeexd.cloudroll
        # XcodeGen writes info.path next to this spec but would reference it
        # relative to the generated project, which lives in the repo root.
        INFOPLIST_FILE: config/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        # Icons are rendered from design/icons/ by scripts/render-icons.sh. The alternates
        # are offered in Settings (AppIconPicker.swift); the compiler adds them to Info.plist.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Sunset AppIcon-Sky AppIcon-Noir AppIcon-Lens AppIcon-Outline AppIcon-Film AppIcon-Aperture AppIcon-GoldenHour AppIcon-Instant AppIcon-Grid"
    scheme:
      testTargets: [CloudrollTests]
  CloudrollTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../tests/CloudrollTests
      - path: ../tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Cloudroll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.keasbeexd.cloudroll.tests
        GENERATE_INFOPLIST_FILE: YES
