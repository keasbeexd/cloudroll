<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- Alternate icon "Lens": an open ring, like a C, with a sun in the gap. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7D5C"/>
      <stop offset="1" stop-color="#E5402B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.45" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#FFB49A" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFB49A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="20" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFBF4"/>
      <stop offset="1" stop-color="#F3E1CE"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#F09A22"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7A1A0E" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <rect width="100" height="100" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <path d="M71.3 35.1 A26 26 0 1 0 71.3 64.9" fill="none" stroke="url(#ring)" stroke-width="13" stroke-linecap="round"/>
    <circle cx="77" cy="50" r="6.5" fill="url(#sun)"/>
  </g>
</svg>
