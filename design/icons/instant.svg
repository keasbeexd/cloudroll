<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- Alternate icon "Instant": a tilted instant photo with a cloud in the shot. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A66"/>
      <stop offset="1" stop-color="#E5412E"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="23" x2="0" y2="63" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A6E2FC"/>
      <stop offset="1" stop-color="#4FA9E8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.4" flood-color="#6E140A" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <g transform="rotate(-8 50 50)">
    <rect x="24" y="18" width="52" height="62" rx="2.5" fill="#FFFBF4" filter="url(#shadow)"/>
    <rect x="29" y="23" width="42" height="40" rx="1.2" fill="url(#sky)"/>
    <circle cx="61" cy="33" r="5" fill="#FFC45E"/>
    <g fill="#FFFFFF">
      <circle cx="40" cy="47" r="6"/>
      <circle cx="49" cy="43" r="8"/>
      <circle cx="57" cy="48" r="5"/>
      <rect x="34" y="47" width="28" height="7" rx="3.5"/>
    </g>
  </g>
</svg>
