name: iOS build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Xcode 26 builds the native bars with Liquid Glass.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec config/project.yml --project .
      - name: Run unit tests
        run: |
          # Simulator names change with each runner image, so pick any available iPhone.
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$DEVICE_ID" ] || [ "$DEVICE_ID" = "null" ]; then
            echo "No iPhone simulator available on this runner" >&2
            exit 1
          fi
          xcodebuild -project Cloudroll.xcodeproj -scheme Cloudroll \
            -destination "id=$DEVICE_ID" test CODE_SIGNING_ALLOWED=NO
      # Unsigned device build for sideloading with SideStore/AltStore, which
      # re-sign it with the user's own Apple ID. The run number makes each build
      # identifiable on the phone (Settings → General → iPhone Storage).
      - name: Build unsigned IPA
        run: |
          xcodebuild -project Cloudroll.xcodeproj -scheme Cloudroll \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath build build CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="0.1.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/Cloudroll.app ipa/Payload/
          (cd ipa && zip -qry ../Cloudroll-unsigned.ipa Payload)
      # Only the maintainer can decrypt the artifact (scripts/fetch-ipa.sh); the
      # recipient is a public key, so no secret is stored on GitHub.
      - name: Encrypt IPA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          brew install age
          age -r "$IPA_RECIPIENT" -o Cloudroll-unsigned.ipa.age Cloudroll-unsigned.ipa
        env:
          IPA_RECIPIENT: age1d6z7wq9uljcnw7ekr6az99r43xvwvdavuz060nswkve3hj7zu5sswkzd78
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: cloudroll-ipa-encrypted
          path: Cloudroll-unsigned.ipa.age
          # scripts/fetch-ipa.sh deletes it after downloading; this is the fallback.
          retention-days: 1
